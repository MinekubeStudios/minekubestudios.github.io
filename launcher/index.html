<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, follow" name="robots"/>
<meta content="Minekube Launcher má novou adresu." name="description"/>
<meta content="#08040b" name="theme-color"/>
<title>Minekube Launcher — přesunuto na minekubelauncher.github.io</title>
<link href="https://minekubelauncher.github.io/" rel="canonical"/>
<!-- Přesměrování je v <meta refresh> i v <script>, aby fungovalo
     i bez JavaScriptu. <link rel="canonical"> říká vyhledávačům,
     kam stránka patří, aby si neindexovaly dvě verze. -->
<meta content="0; url=https://minekubelauncher.github.io/" http-equiv="refresh"/>
<link href="shared/assets/favicon.png" rel="icon" type="image/png"/>
<link href="shared/assets/apple-touch-icon.png" rel="apple-touch-icon"/>
<style>
  /* Stránka má jediný úkol: přesměrovat. Vzhled je proto co
     nejjednodušší — tmavá plocha, logo, věta a odkaz pro případ,
     že přesměrování neproběhne (např. blokované meta refresh). */
  :root {
    color-scheme: dark;
    --bg: #08040b;
    --panel: #130c19;
    --line: #2a1f33;
    --text: #fdf6f1;
    --muted: #cbb7c3;
    --gold: #ffd863;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 216, 99, 0.10), transparent 34rem),
      var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: min(100%, 30rem);
    padding: 34px 30px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  img.logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    display: block;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.35rem, 5vw, 1.7rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  h1 em { font-style: normal; color: var(--gold); }
  p {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
  }
  a.button {
    display: inline-block;
    padding: 13px 22px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #f2a316);
    color: #22110a;
    font-weight: 800;
    font-size: 0.95rem;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  a.button:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 26px rgba(255, 216, 99, 0.22);
  }
  a.button:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }
  .host {
    display: block;
    margin-top: 20px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    opacity: 0.75;
  }
  @media (prefers-reduced-motion: reduce) {
    a.button { transition: none; }
    a.button:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
<img alt="" class="logo" height="64" src="shared/assets/minekube-original-logo.png" width="64"/>
<h1>Minekube Launcher<br/><em>má novou adresu.</em></h1>
<p>Přesouvám tě na <strong>minekubelauncher.github.io</strong>. Kdyby se nic nestalo, klikni na tlačítko.</p>
<a class="button" href="https://minekubelauncher.github.io/">Přejít na launcher</a>
<span class="host">minekubelauncher.github.io</span>
</main>
<script>
/* Záloha k meta refresh — některé prohlížeče ho blokují.
   `replace` místo `assign`, aby tlačítko Zpět nevrátilo na tuto
   mezistránku. */
window.location.replace("https://minekubelauncher.github.io/");
</script>
</body>
</html>
